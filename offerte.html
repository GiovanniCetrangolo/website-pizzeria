<!-- @format -->

<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="style.css" />

    <script src="https://kit.fontawesome.com/53a724d75e.js" crossorigin="anonymous"></script>

    <title>Pizzeria Sasà</title>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Pizzeria Sasà</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="menu.html">Menu</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="facebook.com"><i class="fa-brands fa-facebook"></i></a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="container mt-5">
        <h1 class="text-center mb-4 mt-5">Le nostre offerte</h1>

        <div class="row g-4">
          <div class="col-12 col-md-6 col-lg-4">
            <div class="card h-100">
              <img src="img/teglia-margherita.jpg" class="card-img-top" alt="Teglia margherita" />
              <div class="card-body text-center">
                <h5 class="card-title">Teglia Margherita</h5>
                <p class="card-text">A soli 12€</p>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-6 col-lg-4">
            <div class="card h-100">
              <img src="img/teglia-patate.jpg" class="card-img-top" alt="Teglia patate" />
              <div class="card-body text-center">
                <h5 class="card-title">Teglia Patate</h5>
                <p class="card-text">A soli 14€</p>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-6 col-lg-4">
            <div class="card h-100">
              <img src="img/teglia-salsiccia.jpg" class="card-img-top" alt="Teglia bigusto" />
              <div class="card-body text-center">
                <h5 class="card-title">Teglia Bigusto</h5>
                <p class="card-text">A soli 20€</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="text-bg-dark p-2">
      <div class="container">
        <div class="row row-cols-2 row-cols-md-3">
          <div class="col">
            <h3>Pizzeria Sasà</h3>
            <p>Pizze tonde e pizze in teglia</p>
          </div>

          <div class="col">
            <h3>Orari</h3>
            <p>10:00-22:00</p>
            <p>Tutti i giorni</p>
          </div>

          <div class="col">
            <h3>Indirizzo</h3>
            <p>Via Salaria,x, Monterotondo (RM)</p>
          </div>
        </div>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
